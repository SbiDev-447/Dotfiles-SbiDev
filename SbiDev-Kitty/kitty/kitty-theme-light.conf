#vim:ft=kitty
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              SbiDev Theme                                    │
# └──────────────────────────────────────────────────────────────────────────────┘

# --- Colores Base ---
background            #e3d8b8
foreground            #2a2a2a
cursor                #b8912a
cursor_text_color     #2a2a2a
selection_background  #2a3d5c
selection_foreground  #f8f6f0
url_color             #2f6175

# --- Colores de Pestañas (Tabs) ---
active_tab_background   #2a3d5c
active_tab_foreground   #f8f6f0
inactive_tab_background #d4cfc0
inactive_tab_foreground #565656

# --- Colores Normales (Bases cromáticas claras para sintaxis) ---
color0  #2a2a2a           # Texto primario / Negro suave
color1  #af2526           # Rojo (Errores / Keywords críticas)
color2  #427b58           # Verde turquesa/musgo (Strings)
color3  #b57614           # Amarillo/Naranja mostaza (Tipos / Clases)
color4  #076678           # Azul petróleo (Funciones / Métodos)
color5  #8f3f71           # Magenta/Rosa viejo (Constantes / Números)
color6  #3c3836           # Oscuro neutro (Identificadores secundarios)
color7  #7c6f64           # Gris medio/Comentarios oscuros

# --- Colores Brillantes (Mayor intensidad y jerarquía) ---
color8  #928374           # Gris para comentarios yUI deshabilitada
color9  #9d0006           # Rojo intenso
color10 #538d32           # Verde hoja vivo
color11 #d65d0e           # Naranja cálido (Diferenciación clara de color3)
color12 #205ea6           # Azul cobalto claro
color13 #b16286           # Rosa suave
color14 #008080           # Teal/Cian
color15 #3c3836           # Contraste máximo para texto destacado
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                   FONT                                       │
# └──────────────────────────────────────────────────────────────────────────────┘
font_size 14
font_family      IosevkaTerm Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  WINDOW                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

background_opacity 1
