#vim:ft=kitty
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              SbiDev Theme                                    │
# └──────────────────────────────────────────────────────────────────────────────┘

# --- Colores Base ---
background            #f5efe6
foreground            #2a2a2a
cursor                #d9b45a
selection_background  #2a3d5c
selection_foreground  #f8f6f0
url_color             #6da1b5

# --- Colores de Pestañas (Tabs) ---
active_tab_background   #2a3d5c
active_tab_foreground   #f8f6f0
inactive_tab_background #d4cfc0
inactive_tab_foreground #6b6b6b

# --- Colores Normales (Paleta equilibrada) ---
color0  #1e1e1e          # Negro intenso
color1  #b85a7a          # Rojo rosado
color2  #7fa350          # Verde musgo
color3  #d4a840          # Amarillo mostaza
color4  #4d8fa8          # Azul medio
color5  #cc7a9e          # Rosa medio
color6  #4f8a82          # Verde azulado
color7  #f0ebe0          # Blanco roto

# --- Colores Brillantes (Con buen contraste) ---
color8  #6a6a6a          # Gris oscuro
color9  #d46a8e          # Rosa intenso
color10 #8fb85a          # Verde vivo
color11 #e8c040          # Amarillo dorado
color12 #5a9cb5          # Azul claro
color13 #e08ab0          # Rosa claro
color14 #4d8fa8          # Azul medio (igual que color4)
color15 #f8f6f0          # Blanco crema
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                   FONT                                       │
# └──────────────────────────────────────────────────────────────────────────────┘
font_size 14
font_family      IosevkaTerm Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto

