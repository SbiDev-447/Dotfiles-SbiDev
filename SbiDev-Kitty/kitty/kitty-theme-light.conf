#vim:ft=kitty
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              SbiDev Theme                                    │
# └──────────────────────────────────────────────────────────────────────────────┘

# --- Colores Base ---
background            #e3d8b8
foreground            #2a2a2a
cursor                #b8912a
cursor_text_color     #2a2a2a
selection_background  #2a3d5c
selection_foreground  #f8f6f0
url_color             #2f6175

# --- Colores de Pestañas (Tabs) ---
active_tab_background   #2a3d5c
active_tab_foreground   #f8f6f0
inactive_tab_background #d4cfc0
inactive_tab_foreground #565656

# --- Colores Normales (Paleta equilibrada) ---
color0  #1e1e1e          # Negro intenso
color1  #98425f          # Rojo rosado
color2  #4f6632          # Verde musgo
color3  #765b1b          # Amarillo mostaza
color4  #366576          # Azul medio
color5  #9d3c67          # Rosa medio
color6  #3b6660          # Verde azulado
color7  #5e5e5e          # Blanco roto

# --- Colores Brillantes (Con buen contraste) ---
color8  #555555          # Gris oscuro
color9  #a9315a          # Rosa intenso
color10 #486812          # Verde vivo
color11 #755600          # Amarillo dorado
color12 #006180          # Azul claro
color13 #a91f66          # Rosa claro
color14 #366576          # Azul medio (igual que color4)
color15 #4a4a4a          # Blanco crema
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                   FONT                                       │
# └──────────────────────────────────────────────────────────────────────────────┘
font_size 14
font_family      IosevkaTerm Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  WINDOW                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

background_opacity 1
