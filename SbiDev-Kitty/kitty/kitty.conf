# BEGIN_KITTY_THEME
include kitty-theme.conf
# END_KITTY_THEME

shell /home/sbi/.nix-profile/bin/zsh

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                      NEOVIM OPTIMIZATIONS & PERFORMANCE                      │
# └──────────────────────────────────────────────────────────────────────────────┘

# Terminal
term xterm-kitty

# Undercurl support (LSP diagnostics, spelling)
undercurl_style thin-sparse

# Scrollback
scrollback_lines 10000

# Performance
repaint_delay    10
input_delay      3
sync_to_monitor  yes
shell_integration disabled

# Remote control (nvim plugins)
allow_remote_control yes
listen_on unix:/tmp/kitty

# Disable audio bell
enable_audio_bell no

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  WINDOW                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

background_opacity 0.9
background_blur 80

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  CURSOR                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

# Cursor colors
cursor_shape            block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              KEY MAPPINGS                                    │
# └──────────────────────────────────────────────────────────────────────────────┘

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

