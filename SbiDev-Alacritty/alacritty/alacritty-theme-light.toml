# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                     GENTLEMAN DOTS - ALACRITTY - THEME                       ║
# ║                                  Claro                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# La paleta vive aquí y no en alacritty.toml porque Alacritty da prioridad al
# archivo que importa: si el principal definiera [colors.*], ganaría él y este
# archivo no haría nada.
# Solo colores. [font] se queda en alacritty.toml a propósito.
# Paleta equivalente a SbiDev-Kitty/kitty/kitty-theme-light.conf y a Foot.
# url_color y los colores de tabs de Kitty no tienen equivalente en Alacritty.

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  BASE COLORS                                 │
# └──────────────────────────────────────────────────────────────────────────────┘

[colors.primary]
background = "#e3d8b8"
foreground = "#2a2a2a"

[colors.cursor]
cursor = "#b8912a"
text = "#2a2a2a"

[colors.selection]
background = "#2a3d5c"
text = "#f8f6f0"

# --- Normal Colors ---
[colors.normal]
black = "#2a2a2a"
red = "#af2526"
green = "#427b58"
yellow = "#b57614"
blue = "#076678"
magenta = "#8f3f71"
cyan = "#008080"
white = "#7c6f64"

# --- Bright Colors ---
[colors.bright]
black = "#928374"
red = "#9d0006"
green = "#538d32"
yellow = "#d65f0e"
blue = "#205ea6"
magenta = "#b16286"
cyan = "#008080"
white = "#4a4a4a"

[window]
opacity = 1
