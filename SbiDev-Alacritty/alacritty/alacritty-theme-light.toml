# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                     GENTLEMAN DOTS - ALACRITTY - THEME                       ║
# ║                                  Claro                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# La paleta vive aquí y no en alacritty.toml porque Alacritty da prioridad al
# archivo que importa: si el principal definiera [colors.*], ganaría él y este
# archivo no haría nada.
# Solo colores. [font] se queda en alacritty.toml a propósito.
# Paleta equivalente a SbiDev-Kitty/kitty/kitty-theme-light.conf y a Foot.
# url_color y los colores de tabs de Kitty no tienen equivalente en Alacritty.

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  BASE COLORS                                 │
# └──────────────────────────────────────────────────────────────────────────────┘

[colors.primary]
background = "#e3d8b8"
foreground = "#2a2a2a"

[colors.cursor]
cursor = "#b8912a"
text = "#2a2a2a"

[colors.selection]
background = "#2a3d5c"
text = "#f8f6f0"

# --- Normal Colors ---
[colors.normal]
black = "#1e1e1e"
red = "#98425f"
green = "#4f6632"
yellow = "#765b1b"
blue = "#366576"
magenta = "#9d3c67"
cyan = "#3b6660"
white = "#5e5e5e"

# --- Bright Colors ---
[colors.bright]
black = "#555555"
red = "#a9315a"
green = "#486812"
yellow = "#755600"
blue = "#006180"
magenta = "#a91f66"
cyan = "#366576"
white = "#4a4a4a"

