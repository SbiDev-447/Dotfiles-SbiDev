# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                     GENTLEMAN DOTS - ALACRITTY - THEME                       ║
# ║                            Oscuro (tema por defecto)                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# La paleta vive aquí y no en alacritty.toml porque Alacritty da prioridad al
# archivo que importa: si el principal definiera [colors.*], ganaría él y este
# archivo no haría nada.
# Solo colores. [font] se queda en alacritty.toml a propósito.
# Paleta equivalente a SbiDev-Kitty/kitty/kitty-theme.conf.
# url_color y los colores de tabs de Kitty no tienen equivalente en Alacritty.

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  BASE COLORS                                 │
# └──────────────────────────────────────────────────────────────────────────────┘

[colors.primary]
background = "#06080f"
foreground = "#f3f6f9"

[colors.cursor]
cursor = "#e0c15a"
text = "#06080f"

[colors.selection]
background = "#263356"
text = "#f3f6f9"

# --- Normal Colors ---
[colors.normal]
black   = "#06080f"
red     = "#cb7c94"
green   = "#b7cc85"
yellow  = "#ffe066"
blue    = "#7fb4ca"
magenta = "#ff8dd7"
cyan    = "#7aa89f"
white   = "#f3f6f9"

# --- Bright Colors ---
[colors.bright]
black   = "#8a8fa3"
red     = "#de8fa8"
green   = "#d1e8a9"
yellow  = "#fff7b1"
blue    = "#a3d4d5"
magenta = "#ffaeea"
cyan    = "#7fb4ca"
white   = "#f3f6f9"